
name: student-management ci-cd
on:
  push:
    branches:
      - master
jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

       - name: setup java
         uses: actions/setup-java@v6
         with:
           distribution: temurin
           java-version: "21"
           cache: maven




